[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pfme-finite-sample-misranking"
version = "1.0.0"
description = "Paired finite-sample misranking analysis across blackjack, inventory, and Bernoulli systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Aarav Jalan"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numba>=0.59,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<12",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

